name: generate-sdk

run-name: Generate SDK (${{ github.event.client_payload.service || inputs.sdk || 'all' }})

on:
  repository_dispatch:
    types:
      - service-deployed
        # Payload fields:
        # - service (service deployed) (ChannelAPI, ChannelLifecycleState, slate-management)
        # - version (version deployed)
        # - deployment_run_url (the run url of the deployment which triggered this dispatch)
  workflow_dispatch:
    inputs:
      sdk:
        description: 'sdk to generate'
        required: true
        type: choice
        options:
          - all
          - ChannelAPI
          - ChannelLifecycleState
          - slate-management
  workflow_call:
    inputs:
      pr-base:
        required: true
        type: string
    secrets:
      ORG_ISP_WRITER_APP_CLIENT_ID:
        required: true
      ORG_ISP_WRITER_APP_PRIVATE_KEY:
        required: true
      SLACK_WEBHOOK_LCP_PRS:
        required: true
    outputs:
      pr-number:
        description: pr number
        value: ${{ jobs.generate-sdk.outputs.pr-number }}

permissions:
  actions: read
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.client_payload.service || inputs.sdk || 'all'}}
  cancel-in-progress: true

jobs:

  generate-sdk:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
    steps:

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.ORG_ISP_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_ISP_WRITER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive

      - name: Parse and validate inputs
        id: parse-inputs
        env:
          INPUT_PR_BASE: ${{ inputs.pr-base }}
          INPUT_SDK: ${{ inputs.sdk || 'all' }}
          CLIENT_PAYLOAD_SERVICE: ${{ github.event.client_payload.service }}
          CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          # Resolve parameters across different triggers

          echo "::group::Parse SDK to generate"
            # Default to the sdk input of workflow dispatch
            SDK_TO_GENERATE="$INPUT_SDK"

            # If triggered by repository_dispatch, use the client payload's service field
            if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
              SDK_TO_GENERATE="$CLIENT_PAYLOAD_SERVICE"
            fi

            # Keep the human-readable name as given, then normalize to the
            # lowercase, shortened key used for matching below
            SDK_DISPLAY_NAME="$SDK_TO_GENERATE"

            case "$SDK_TO_GENERATE" in
              ChannelAPI)
                SDK_TO_GENERATE="channelapi"
                ;;
              ChannelLifecycleState)
                SDK_TO_GENERATE="lifecycle"
                ;;
              slate-management)
                SDK_TO_GENERATE="slates"
                ;;
              all)
                SDK_TO_GENERATE="all"
                ;;
              *)
                echo "::error::Unrecognized sdk: $SDK_TO_GENERATE"
                exit 1
                ;;
            esac

            {
              echo "sdk-to-generate=$SDK_TO_GENERATE";
              echo "sdk-display-name=$SDK_DISPLAY_NAME";
            } | tee -a "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Determine the base for the PR, if one should be created"
            # Default to the ref this workflow ran from
            PR_BASE="$GITHUB_REF_NAME"

            # If triggered via issue_comment, use the pr-base input
            if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
              PR_BASE="${INPUT_PR_BASE}"
            fi

            echo "pr-base=$PR_BASE" | tee -a "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Determine the version of the service deployment, if one triggered this"
            VERSION=""
            if [[ -n "$CLIENT_PAYLOAD_VERSION" ]]; then
              VERSION="$CLIENT_PAYLOAD_VERSION"
            fi

            echo "deployment-version=$VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Determine SDK label
        id: sdk-label
        env:
          SDK_DISPLAY_NAME: ${{ steps.parse-inputs.outputs.sdk-display-name }}
        run: |
          LABEL=""
          if [[ "$SDK_DISPLAY_NAME" == "all" ]]; then
            LABEL="all SDKs"
          else
            LABEL="${SDK_DISPLAY_NAME} SDK"
          fi

          echo "label=$LABEL" | tee -a "$GITHUB_OUTPUT"

      - name: Output booleans for which SDKs to generate
        id: pick-sdks
        env:
          SDK_TO_GENERATE: ${{ steps.parse-inputs.outputs.sdk-to-generate }}
        run: |
          CHANNELAPI=false
          SLATES=false
          LIFECYCLE=false

          case "$SDK_TO_GENERATE" in
            all)
              CHANNELAPI=true
              SLATES=true
              LIFECYCLE=true
              ;;
            channelapi)
              CHANNELAPI=true
              ;;
            slates)
              SLATES=true
              ;;
            lifecycle)
              LIFECYCLE=true
              ;;
            *)
              echo "::error::Unrecognized sdk: $SDK_TO_GENERATE"
              exit 1
              ;;
          esac

          {
            echo "channelapi=$CHANNELAPI";
            echo "slates=$SLATES";
            echo "lifecycle=$LIFECYCLE";
          } | tee -a "$GITHUB_OUTPUT"

      - name: Determine head branch name
        id: pr-head
        env:
          BASE: ${{ steps.parse-inputs.outputs.pr-base }}
        run: |
          DATE=$(date '+%s')
          echo "name=gen/$BASE/$DATE" | tee -a "$GITHUB_OUTPUT"

      - name: Re-generate isp
        if: ${{ steps.pick-sdks.outputs.channelapi == 'true' }}
        run: ./run.sh isp

      - name: Re-generate isp-slate
        if: ${{ steps.pick-sdks.outputs.slates == 'true' }}
        run: ./run.sh isp-slate

      - name: Re-generate isp-lifecycle
        if: ${{ steps.pick-sdks.outputs.lifecycle == 'true' }}
        run: ./run.sh isp-lifecycle

      - name: Detect generated changes
        id: changes
        run: |
          git status

          if [ -n "$(git status -s)" ]; then
            echo "should-commit=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "should-commit=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Create and push branch
        if: steps.changes.outputs.should-commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.pr-head.outputs.name }}
          git push -u origin ${{ steps.pr-head.outputs.name }}

      - name: Commit changes
        if: steps.changes.outputs.should-commit == 'true'
        uses: planetscale/ghcommit-action@v0.2.20
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          commit_message: "re-generate sdk"
          repo: ${{ github.repository }}
          branch: ${{ steps.pr-head.outputs.name }}
          file_pattern: 'isp isp-slate isp-lifecycle spec'

      - name: Prepare PR details
        id: pr-details
        env:
          SDK_TO_GENERATE: ${{ steps.parse-inputs.outputs.sdk-display-name }}
          SDK_LABEL: ${{ steps.sdk-label.outputs.label }}
          DEPLOYMENT_VERSION: ${{ steps.parse-inputs.outputs.deployment-version }}
          REPO_DISPATCH_DEPLOYMENT_RUN_URL: ${{ github.event.client_payload.deployment_run_url }}
          GENERATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Create a temporary file under the runner's temp dir to hold the PR body
          echo "::group::Create a temporary file for the PR body"
            PR_BODY_FILE="$RUNNER_TEMP/pr-body.md"
            touch "$PR_BODY_FILE"
            echo "file=$PR_BODY_FILE" | tee -a "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Determine the PR title and body"
            if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
              PR_TITLE="chore: re-generate $SDK_LABEL after deployment of $DEPLOYMENT_VERSION"
              echo "title=$PR_TITLE" | tee -a "$GITHUB_OUTPUT"

              {
                echo "Updating $SDK_TO_GENERATE SDK after deployment of $DEPLOYMENT_VERSION to production.";
                echo "";
                echo "Workflows that triggered this PR:";
                echo "* [Deployment workflow]($REPO_DISPATCH_DEPLOYMENT_RUN_URL)";
                echo "* [Generation workflow]($GENERATION_RUN_URL)";
              } >> "$PR_BODY_FILE"
            else
              PR_TITLE="chore: re-generate $SDK_LABEL"
              echo "title=$PR_TITLE" | tee -a "$GITHUB_OUTPUT"

              {
                echo "Update $SDK_LABEL.";
                echo "";
                echo "Workflows that triggered this PR:";
                echo "* [Generation workflow]($GENERATION_RUN_URL)";
              } >> "$PR_BODY_FILE"
            fi

          echo "::endgroup::"

      - name: Create Pull Request
        id: create-pr
        if: steps.changes.outputs.should-commit == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr create \
            --title "${{ steps.pr-details.outputs.title }}" \
            --body-file "${{ steps.pr-details.outputs.file }}" \
            --base ${{ steps.parse-inputs.outputs.pr-base }} \
            --head ${{ steps.pr-head.outputs.name }})

          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]\+$')
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Print summary
        if: steps.changes.outputs.should-commit == 'true'
        env:
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          echo "Created [#${PR_NUMBER}](${PR_URL})" > "$GITHUB_STEP_SUMMARY"
      
      - name: Check for Slack webhook
        id: check-for-slack-webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_LCP_PRS }}
        run: |
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            echo "slack-webhook-url-set=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "slack-webhook-url-set=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Send PR to slack
        if: ${{ steps.changes.outputs.should-commit == 'true' && steps.check-for-slack-webhook.outputs.slack-webhook-url-set == 'true' }}
        uses: slackapi/slack-github-action@v4
        continue-on-error: true
        with:
          errors: true
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_LCP_PRS }}
          payload: |
            text: "PR: Re-generate SMPL go-sdk (${{ steps.parse-inputs.outputs.sdk-display-name }})"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<${{ steps.create-pr.outputs.pull-request-url }}|PR: Re-generate SMPL go-sdk (${{ steps.parse-inputs.outputs.sdk-display-name }})>"
